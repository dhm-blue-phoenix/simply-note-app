[workspace]
members = [
    "app"
]
resolver = "3"

[workspace.dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tower = "0.5.3"
http-body-util = "0.1.5"
cargo-watch = "8.5.3"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "tls-native-tls"] }
uuid = { version = "1.26.1", features = ["v8"] }
chrono = "0.4.45"
dotenvy = "0.15.7"