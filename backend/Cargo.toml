[package]
name = "simply-note-service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5.3"
http-body-util = "0.1.5"
cargo-watch = "8.5.3"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "tls-native-tls"] }
uuid = { version = "1.26.0", features = ["v8"] }
chrono = "0.4.45"
dotenvy = "0.15.7"